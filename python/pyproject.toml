[build-system]
requires = ["setuptools>=81,<82", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "song-geometry-mapper"
version = "0.1.0"
description = "Extract frame-wise spectral descriptors for Song Geometry Mapper visualizations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "librosa>=0.11.0",
  "numpy>=2.4.4",
  "pandas>=3.0.2",
  "scipy>=1.17.1"
]

[project.optional-dependencies]
separation = [
  "demucs>=4.0.1"
]
dev = [
  "pytest>=9.0.3"
]

[project.scripts]
bgm-analyze = "bgm.analyze:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bgm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
